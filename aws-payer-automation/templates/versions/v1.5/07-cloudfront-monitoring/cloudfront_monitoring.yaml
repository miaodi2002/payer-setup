AWSTemplateFormatVersion: '2010-09-09'
Description: "CloudFront traffic monitoring with intelligent OAM setup across multiple accounts"

Parameters:
  PayerName:
    Type: String
    Description: "Name of the Payer (use Master Account name from AWS Organizations)"
    
  PayerAccountId:
    Type: String
    Description: "Master Account ID for this Payer"
    
  CloudFrontThresholdMB:
    Type: Number
    Default: 5120
    Description: "CloudFront traffic threshold in MB (15-minute window) - Default: 5GB"
    
  TelegramGroupId:
    Type: String
    Default: "-862835857"
    Description: "Telegram group ID for notifications"
    
  TelegramApiEndpoint:
    Type: String
    Default: "http://3.112.108.101:8509/api/sendout"
    Description: "Telegram Bot API endpoint"

Resources:
  # OAM Sink for centralized monitoring in Payer account
  MonitoringSink:
    Type: AWS::Oam::Sink
    Properties:
      Name: !Sub "${PayerName}-monitoring-sink"
      Policy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action:
              - "oam:CreateLink"
              - "oam:UpdateLink"
            Resource: "*"
            Condition:
              ForAllValues:StringEquals:
                oam:ResourceTypes:
                  - "AWS::CloudWatch::Metric"
                  - "AWS::Logs::LogGroup"
                  - "AWS::XRay::Trace"
                  - "AWS::ApplicationInsights::Application"
                  - "AWS::InternetMonitor::Monitor"


  # SNS Topic for CloudFront traffic alerts
  CloudFrontAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${PayerName}-CloudFront-Traffic-Alerts"
      DisplayName: !Sub "${PayerName} CloudFront Traffic Monitoring"

  # IAM Role for CloudFront Alert Lambda
  CloudFrontAlertRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${PayerName}-CloudFrontAlertRole"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudWatchMetricsPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricData
                  - cloudwatch:GetMetricStatistics
                  - cloudwatch:ListMetrics
                  - organizations:ListAccounts
                  - organizations:DescribeOrganization
                Resource: "*"

  # Lambda function for CloudFront traffic alerts
  CloudFrontAlertFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${PayerName}-CloudFront-Alert"
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt CloudFrontAlertRole.Arn
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          PAYER_NAME: !Ref PayerName
          PAYER_ACCOUNT_ID: !Ref PayerAccountId
          TELEGRAM_GROUP_ID: !Ref TelegramGroupId
          TELEGRAM_API_ENDPOINT: !Ref TelegramApiEndpoint
          THRESHOLD_MB: !Ref CloudFrontThresholdMB
      Code:
        ZipFile: |
          import json
          import boto3
          import urllib.request
          import urllib.parse
          from datetime import datetime, timedelta, timezone
          import os

          def lambda_handler(event, context):
              print(f"Received CloudWatch alarm event: {json.dumps(event)}")

              for record in event['Records']:
                  sns_message = record['Sns']['Message']
                  message = json.loads(sns_message)

                  # Extract alarm information
                  alarm_name = message['AlarmName']
                  new_state = message['NewStateValue']
                  reason = message['NewStateReason']
                  region = message['Region']

                  print(f"Processing alarm: {alarm_name}, State: {new_state}")

                  if new_state == 'ALARM':
                      # Parse the alarm evaluation time so we query the same window
                      state_change_time = parse_state_change_time(message.get('StateChangeTime'))

                      # Find top traffic accounts that drove the alarm
                      top_accounts = find_top_usage_accounts(state_change_time)

                      # Send Telegram alert
                      send_cloudfront_alert(alarm_name, top_accounts, message, state_change_time)

              return {
                  'statusCode': 200,
                  'body': json.dumps('Success')
              }

          def parse_state_change_time(raw):
              # CloudWatch sends e.g. "2026-05-17T00:30:18.928+0000"
              if raw:
                  try:
                      cleaned = raw.replace('Z', '+0000')
                      # strip fractional seconds for robust parsing
                      if '.' in cleaned:
                          head, tail = cleaned.split('.', 1)
                          tz = tail[-5:] if (tail.endswith('0000') or '+' in tail or '-' in tail[1:]) else '+0000'
                          cleaned = head + tz
                      return datetime.strptime(cleaned, '%Y-%m-%dT%H:%M:%S%z')
                  except Exception as e:
                      print(f"Could not parse StateChangeTime '{raw}': {e}")
              return datetime.now(timezone.utc)
          
          def find_top_usage_accounts(state_change_time):
              # OAM monitoring account: list-metrics + Metrics Insights span all
              # linked member accounts. Build DistributionId -> OwningAccount map,
              # then aggregate per-distribution traffic back to the owning account.
              cloudwatch = boto3.client('cloudwatch')

              try:
                  dist_to_account = {}
                  paginator = cloudwatch.get_paginator('list_metrics')
                  for page in paginator.paginate(
                      Namespace='AWS/CloudFront',
                      MetricName='BytesDownloaded',
                      IncludeLinkedAccounts=True,
                  ):
                      owners = page.get('OwningAccounts', [])
                      for metric, owner in zip(page.get('Metrics', []), owners):
                          dist = next((d['Value'] for d in metric.get('Dimensions', [])
                                       if d['Name'] == 'DistributionId'), None)
                          if dist:
                              dist_to_account[dist] = owner

                  print(f"Mapped {len(dist_to_account)} distributions to owning accounts")

                  end = state_change_time.replace(second=0, microsecond=0)
                  start = end - timedelta(minutes=15)
                  result = cloudwatch.get_metric_data(
                      MetricDataQueries=[{
                          'Id': 'q',
                          'Expression': (
                              'SELECT SUM(BytesDownloaded) FROM SCHEMA('
                              '"AWS/CloudFront", DistributionId,Region) '
                              'GROUP BY DistributionId'
                          ),
                          'Period': 900,
                      }],
                      StartTime=start,
                      EndTime=end,
                  )
              except Exception as e:
                  print(f"Error querying CloudFront metrics: {str(e)}")
                  return []

              acct_total = {}
              acct_dists = {}
              for series in result.get('MetricDataResults', []):
                  dist = series.get('Label', 'unknown')
                  mb = sum(series.get('Values', [])) / 1048576.0
                  if mb <= 0:
                      continue
                  acct = dist_to_account.get(dist, 'unknown')
                  acct_total[acct] = acct_total.get(acct, 0) + mb
                  acct_dists.setdefault(acct, []).append((dist, round(mb, 2)))

              top = []
              for acct, mb in sorted(acct_total.items(), key=lambda x: -x[1])[:5]:
                  top.append({
                      'account_id': acct,
                      'usage_mb': round(mb, 2),
                      'top_distributions': sorted(
                          acct_dists[acct], key=lambda x: -x[1])[:3],
                  })
              return top
          
          def send_cloudfront_alert(alarm_name, top_accounts, alarm_details, state_change_time):
              payer_name = os.environ['PAYER_NAME']
              payer_account_id = os.environ['PAYER_ACCOUNT_ID']
              threshold_mb = os.environ['THRESHOLD_MB']

              # Build formatted message with Payer name and ID
              payer_display = f"{payer_name}({payer_account_id})"
              message = build_alert_message(payer_display, alarm_name, top_accounts, threshold_mb, state_change_time)

              # Send to Telegram
              send_telegram_message(message)

          def build_alert_message(payer_display, alarm_name, top_accounts, threshold_mb, state_change_time):
              timestamp = state_change_time.strftime('%Y-%m-%d %H:%M:%S UTC')

              message = f"🚨 CloudFront流量告警 - {payer_display}\n\n"

              if top_accounts:
                  message += "📊 Top 流量账户 (近15分钟):\n"
                  message += "┌─────────────────────────\n"

                  for index, account in enumerate(top_accounts):
                      percentage = round((account['usage_mb'] / float(threshold_mb) - 1) * 100, 1)
                      sign = '+' if percentage >= 0 else ''
                      message += f"│ {index + 1}. 账户: {account['account_id']}\n"
                      message += f"│    用量: {account['usage_mb']} MB (阈值 {threshold_mb} MB, {sign}{percentage}%)\n"
                      if account.get('top_distributions'):
                          message += "│    Top distributions:\n"
                          for dist_id, dist_mb in account['top_distributions']:
                              message += f"│      • {dist_id}: {dist_mb} MB\n"
                      if index < len(top_accounts) - 1:
                          message += "├─────────────────────────\n"

                  message += "└─────────────────────────\n\n"
              else:
                  message += "❌ 无法获取流量明细，请人工排查 CloudWatch\n\n"

              message += "📈 告警信息:\n"
              message += f"• 告警名称: {alarm_name}\n"
              message += f"• 设定阈值: {threshold_mb} MB\n"
              message += "• 监控周期: 15分钟\n"
              message += f"• 告警时间: {timestamp}\n\n"

              message += "⚠️ 建议立即检查CloudFront使用情况\n\n"

              message += "🔗 快速链接:\n"
              message += "• CloudFront: https://console.aws.amazon.com/cloudfront\n"
              message += "• CloudWatch: https://console.aws.amazon.com/cloudwatch"

              return message
          
          def send_telegram_message(message):
              try:
                  url = os.environ['TELEGRAM_API_ENDPOINT']
                  data = urllib.parse.urlencode({
                      'group': os.environ['TELEGRAM_GROUP_ID'],
                      'message': message
                  }).encode('utf-8')
                  
                  req = urllib.request.Request(url, data=data, method='POST')
                  req.add_header('Content-Type', 'application/x-www-form-urlencoded')
                  
                  with urllib.request.urlopen(req) as response:
                      response_body = response.read().decode('utf-8')
                      print(f"Telegram API Response: {response.status} - {response_body}")
                  
              except Exception as e:
                  print(f"Failed to send Telegram message: {str(e)}")

  # CloudWatch Alarm for CloudFront traffic monitoring
  CloudFrontTrafficAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${PayerName}_CloudFront_Cross_Account_Traffic"
      AlarmDescription: !Sub "Monitor CloudFront traffic across all ${PayerName} member accounts"
      ActionsEnabled: true
      AlarmActions:
        - !Ref CloudFrontAlarmTopic
      OKActions: []
      InsufficientDataActions: []
      Dimensions: []
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: !Ref CloudFrontThresholdMB
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing
      Metrics:
        - Id: "total_cloudfront_bytes"
          ReturnData: false
          Expression: 'SELECT SUM(BytesDownloaded) FROM SCHEMA("AWS/CloudFront", DistributionId,Region)'
          Period: 900
        - Id: "total_cloudfront_mb"
          Label: !Sub "${PayerName}_CloudFront_15min_Total_MB"
          ReturnData: true
          Expression: "total_cloudfront_bytes / 1048576"

  # Lambda permission for SNS to invoke CloudFront alert function
  CloudFrontAlertPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CloudFrontAlertFunction
      Action: lambda:InvokeFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref CloudFrontAlarmTopic

  # SNS subscription to trigger Lambda
  CloudFrontAlarmSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: lambda
      TopicArn: !Ref CloudFrontAlarmTopic
      Endpoint: !GetAtt CloudFrontAlertFunction.Arn

Outputs:
  MonitoringSinkArn:
    Description: "ARN of the OAM Sink for centralized monitoring"
    Value: !GetAtt MonitoringSink.Arn
    Export:
      Name: !Sub "${AWS::StackName}-MonitoringSink"
      
  CloudFrontAlarmName:
    Description: "Name of the CloudFront traffic alarm"
    Value: !Ref CloudFrontTrafficAlarm
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontAlarm"
      
  AlertFunctionArn:
    Description: "ARN of the CloudFront alert Lambda function"
    Value: !GetAtt CloudFrontAlertFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-AlertFunction"
      
  PayerName:
    Description: "Name of the Payer being monitored"
    Value: !Ref PayerName
    Export:
      Name: !Sub "${AWS::StackName}-PayerName"
      
  ThresholdMB:
    Description: "CloudFront traffic threshold in MB"
    Value: !Ref CloudFrontThresholdMB
    Export:
      Name: !Sub "${AWS::StackName}-Threshold"